name: XCR Sync

on:
  workflow_dispatch:
    inputs:
      source_registry:
        description: Source registry, like docker.io or ghcr.io
        required: true
        type: string
      source_repo:
        description: Source repository, like library/mysql
        required: true
        type: string
      source_tag:
        description: Source tag, like 8.0
        required: true
        type: string
      platforms:
        description: Comma-separated platforms
        required: false
        default: linux/amd64,linux/arm64
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Login to Docker Registry
        run: echo "${{ secrets.REPO_PWD }}" | docker login -u "${{ secrets.REPO_USERNAME }}" --password-stdin "${{ secrets.REPO_ENDPOINT }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync image to Aliyun
        env:
          TARGET_REPO: registry.cn-hangzhou.aliyuncs.com/jihuayu/public
          XCR_CALLBACK_URL: ${{ secrets.XCR_CALLBACK_URL }}
          XCR_CALLBACK_SECRET: ${{ secrets.XCR_CALLBACK_SECRET }}
        run: |
          python sync_action.py \
            --source-registry "${{ inputs.source_registry }}" \
            --source-repo "${{ inputs.source_repo }}" \
            --source-tag "${{ inputs.source_tag }}" \
            --platforms "${{ inputs.platforms }}"
